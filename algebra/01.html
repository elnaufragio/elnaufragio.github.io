<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lógica</title>
    <style>
        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            background-color: #2D313D;
            color: #cae465;
            font-family: Arial, sans-serif;
        }
        #pdf-canvas-container {
            
            width: 73%; /* Reducir el tamaño del contenedor del canvas */
            border-radius: 7px; /* Redondear los bordes del contenedor */
            overflow: hidden; /* Ocultar el contenido que exceda el contenedor */
            margin-top: 20px; /* Ajustar este valor para controlar el espacio */
            
        }
        #pdf-canvas {
            display: block;
            margin: 0 auto;
            width: 99%; 
            height: auto;
            border: 1px solid #e2d349;
        }
        #controls {
            margin-top: 7px; /* Distancia de los botones al contenedor del pdf */
            display: flex;
            align-items: center;
        }
        button {
            padding: 10px 20px;
            margin: 5px;
            background-color: #1b1b1b;
            color: #ffffff;
            border: 1px solid #f0c330;
            border-radius: 20px; /* Redondear los botones */
            cursor: pointer;
            transition: background-color 0.3s, color 0.3s;
        }
        button:hover {
            background-color: #ffffff;
            color: #121212;
        }
        #page-info {
            margin: 0 5px;
        }
    </style>
</head>
<body>
    <div id="pdf-canvas-container">
        <canvas id="pdf-canvas"></canvas>
    </div>
    <div id="controls">
        <button id="prev-page">Anterior</button>
        <span id="page-info"></span>
        <button id="next-page">Siguiente</button>
    </div>

    <!-- Incluye PDF.js desde el CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.2.146/pdf.min.js"></script>
    <script>
        const url = '01.pdf'; // Aquí enlazamos el archivo PDF

        let pdfDoc = null,
            pageNum = 1,
            pageRendering = false,
            pageNumPending = null,
            scale = 1.5,
            canvasContainer = document.getElementById('pdf-canvas-container'),
            canvas = document.getElementById('pdf-canvas'),
            ctx = canvas.getContext('2d');

        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.2.146/pdf.worker.min.js';

        pdfjsLib.getDocument(url).promise.then(function(pdfDoc_) {
            pdfDoc = pdfDoc_;
            document.getElementById('page-info').textContent = `Page 1 of ${pdfDoc.numPages}`;
            renderPage(pageNum);
        });

        function renderPage(num) {
            pageRendering = true;
            pdfDoc.getPage(num).then(function(page) {
                let viewport = page.getViewport({ scale: scale });
                canvas.height = viewport.height;
                canvas.width = viewport.width;

                let renderContext = {
                    canvasContext: ctx,
                    viewport: viewport
                };
                let renderTask = page.render(renderContext);

                renderTask.promise.then(function() {
                    pageRendering = false;
                    if (pageNumPending !== null) {
                        renderPage(pageNumPending);
                        pageNumPending = null;
                    }
                });
            });

            document.getElementById('page-info').textContent = `Página ${num} de ${pdfDoc.numPages}`;
        }

        function queueRenderPage(num) {
            if (pageRendering) {
                pageNumPending = num;
            } else {
                renderPage(num);
            }
        }

        document.getElementById('prev-page').addEventListener('click', function() {
            if (pageNum <= 1) {
                return;
            }
            pageNum--;
            queueRenderPage(pageNum);
        });

        document.getElementById('next-page').addEventListener('click', function() {
            if (pageNum >= pdfDoc.numPages) {
                return;
            }
            pageNum++;
            queueRenderPage(pageNum);
        });
    </script>
</body>
</html>
